<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rung Chuông Vàng - Hóa Học 12 (Chương 3)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.FB = { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot };
    </script>
    <style>
        body { 
            background: #071026;
            background: radial-gradient(circle at 50% -20%, #1e3a8a 0%, #071026 75%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            color: white; 
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .student-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .student-btn:active { transform: scale(0.95); }
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #334155; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.25s ease-out forwards; }
        
        .timer-circle {
            transition: stroke-dashoffset 1s linear;
        }
    </style>
</head>
<body>
    <div id="root" class="min-h-screen flex flex-col"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Bộ 12 câu hỏi Trắc nghiệm 4 lựa chọn ôn tập toàn bộ Chương 3: Hợp chất chứa Nitrogen - Hóa 12 (Kết nối tri thức)
        // Độ khó tăng dần từ Nhận biết -> Thông hiểu -> Vận dụng -> Câu Chuông Vàng
        const QUESTIONS = [
            {
                q: "Chất nào sau đây là nguyên nhân chính gây nên mùi tanh của cá?",
                options: {
                    A: "Aniline",
                    B: "Trimethylamine",
                    C: "Glycine",
                    D: "Albumin"
                },
                correct: "B",
                a: "B. Trimethylamine - (CH3)3N",
                keywords: ["b", "trimethylamine", "(ch3)3n"]
            },
            {
                q: "Hợp chất C6H5NH2 là nguyên liệu quan trọng trong công nghiệp phẩm nhuộm và dược phẩm. Tên thông thường của C6H5NH2 là gì?",
                options: {
                    A: "Methylamine",
                    B: "Ethylamine",
                    C: "Aniline",
                    D: "Alanine"
                },
                correct: "C",
                a: "C. Aniline (C6H5NH2)",
                keywords: ["c", "aniline", "anilin"]
            },
            {
                q: "Nhỏ vài giọt dung dịch aniline vào ống nghiệm đựng nước bromine thì quan sát thấy hiện tượng gì?",
                options: {
                    A: "Xuất hiện kết tủa màu trắng",
                    B: "Dung dịch chuyển sang màu tím",
                    C: "Xuất hiện kết tủa màu nâu đỏ",
                    D: "Sủi bọt khí không màu"
                },
                correct: "A",
                a: "A. Xuất hiện kết tủa màu trắng (2,4,6-tribromoaniline)",
                keywords: ["a", "kết tủa màu trắng", "trắng"]
            },
            {
                q: "Trong các đồng phân cấu tạo của amine có công thức phân tử C3H9N, có bao nhiêu đồng phân là amine bậc hai?",
                options: {
                    A: "0",
                    B: "1",
                    C: "2",
                    D: "3"
                },
                correct: "B",
                a: "B. 1 đồng phân (CH3-NH-C2H5: ethylmethylamine)",
                keywords: ["b", "1"]
            },
            {
                q: "Amino acid đơn giản nhất có công thức cấu tạo H2N-CH2-COOH có tên thông thường và kí hiệu là gì?",
                options: {
                    A: "Alanine (Ala)",
                    B: "Valine (Val)",
                    C: "Lysine (Lys)",
                    D: "Glycine (Gly)"
                },
                correct: "D",
                a: "D. Glycine (Gly)",
                keywords: ["d", "glycine", "gly"]
            },
            {
                q: "Ở điều kiện thường, các amino acid là chất rắn, có nhiệt độ nóng chảy cao và tan tốt trong nước vì chúng tồn tại chủ yếu ở dạng nào?",
                options: {
                    A: "Phân tử không phân cực",
                    B: "Ion lưỡng cực",
                    C: "Cation (ion dương)",
                    D: "Anion (ion âm)"
                },
                correct: "B",
                a: "B. Ion lưỡng cực",
                keywords: ["b", "ion lưỡng cực", "lưỡng cực"]
            },
            {
                q: "Các peptide có từ 2 liên kết peptide trở lên (từ tripeptide trở lên) phản ứng với thuốc thử biuret (Cu(OH)2/OH-) tạo dung dịch có màu gì đặc trưng?",
                options: {
                    A: "Màu vàng",
                    B: "Màu đỏ gạch",
                    C: "Màu tím",
                    D: "Màu trắng"
                },
                correct: "C",
                a: "C. Màu tím đặc trưng",
                keywords: ["c", "màu tím", "tím"]
            },
            {
                q: "Nhỏ vài giọt dung dịch nitric acid (HNO3) đặc vào ống nghiệm đựng dung dịch lòng trắng trứng (albumin) thì tạo thành sản phẩm rắn có màu gì?",
                options: {
                    A: "Màu vàng",
                    B: "Màu xanh lam",
                    C: "Màu đen",
                    D: "Màu hồng"
                },
                correct: "A",
                a: "A. Màu vàng (do phản ứng nitro hóa và đông tụ protein)",
                keywords: ["a", "màu vàng", "vàng"]
            },
            {
                q: "Ở pH ≈ 6, glycine tồn tại chủ yếu ở dạng ion lưỡng cực. Nếu đặt trong điện trường ở môi trường acid mạnh (pH < 2), glycine sẽ di chuyển như thế nào?",
                options: {
                    A: "Không di chuyển",
                    B: "Di chuyển về cực dương (+)",
                    C: "Di chuyển về cực âm (-)",
                    D: "Bay hơi khỏi dung dịch"
                },
                correct: "C",
                a: "C. Di chuyển về cực âm (-) do nhận H+ thành cation",
                keywords: ["c", "cực âm", "âm"]
            },
            {
                q: "Trùng ngưng ε-aminocaproic acid (H2N-[CH2]5-COOH) thu được polymer dùng để sản xuất loại tơ nào sau đây?",
                options: {
                    A: "Tơ tằm",
                    B: "Tơ visco",
                    C: "Tơ nitron (olon)",
                    D: "Tơ capron"
                },
                correct: "D",
                a: "D. Tơ capron (polycaproamide)",
                keywords: ["d", "tơ capron", "capron"]
            },
            {
                q: "Cho các phát biểu: (1) Ethylamine và aniline đều làm xanh quỳ tím; (2) Methylamine tạo phức màu xanh lam với Cu(OH)2; (3) Methylamine tác dụng với FeCl3 tạo kết tủa nâu đỏ; (4) Protein bị đông tụ khi đun nóng. Số phát biểu ĐÚNG là:",
                options: {
                    A: "1",
                    B: "2",
                    C: "3",
                    D: "4"
                },
                correct: "C",
                a: "C. 3 phát biểu đúng là (2), (3), (4). Phát biểu (1) sai vì aniline không làm đổi màu quỳ tím",
                keywords: ["c", "3"]
            },
            {
                q: "🔔 CÂU CHUÔNG VÀNG: Thủy phân không hoàn toàn tetrapeptide mạch hở Ala-Gly-Glu-Val có thể thu được tối đa bao nhiêu loại peptide nhỏ hơn (gồm cả dipeptide và tripeptide)?",
                options: {
                    A: "3 peptide",
                    B: "4 peptide",
                    C: "5 peptide",
                    D: "6 peptide"
                },
                correct: "C",
                a: "C. 5 peptide (3 dipeptide: Ala-Gly, Gly-Glu, Glu-Val và 2 tripeptide: Ala-Gly-Glu, Gly-Glu-Val)",
                keywords: ["c", "5", "5 peptide"]
            }
        ];

        const TIME_LIMIT = 20;

        // Chuẩn hóa chuỗi tiếng Việt để so sánh tên và đáp án
        const normalizeText = (str) => {
            if (!str) return "";
            return str.toString().trim().toLowerCase().replace(/\s+/g, ' ');
        };

        const checkAnswerCorrect = (userAns, questionObj) => {
            const cleanAns = normalizeText(userAns);
            if (!cleanAns) return false;
            const correctKey = normalizeText(questionObj.correct);
            if (cleanAns === correctKey || cleanAns.startsWith(correctKey + ".") || cleanAns.startsWith(correctKey + " ")) {
                return true;
            }
            return questionObj.keywords.some(kw => {
                const cleanKw = normalizeText(kw);
                if (cleanKw.length <= 2) {
                    return cleanAns === cleanKw;
                }
                return cleanAns.includes(cleanKw);
            });
        };

        const DEFAULT_STATE = {
            isSetup: true,
            currentQ: 0,
            gameState: 'ready', // 'ready' | 'running' | 'locked'
            timeLeft: TIME_LIMIT,
            students: [],
            answers: {}, // { studentId: "A" | "B" | "C" | "D" }
            evalOverrides: {}, // { studentId: boolean }
            rescuesLeft: 2,
            paperPlaneLeft: 1
        };

        // Kiểm tra xem URL hiện tại có phải là link web hợp lệ (http/https) để điện thoại quét mở được ngay không
        const getInitialValidUrl = () => {
            try {
                const href = window.location.href;
                if (href.startsWith('http://') || href.startsWith('https://')) {
                    if (!href.includes('about:') && !href.includes('blob:')) {
                        return href.split('?')[0];
                    }
                }
                if (document.referrer && (document.referrer.startsWith('http://') || document.referrer.startsWith('https://'))) {
                    return document.referrer.split('?')[0];
                }
            } catch (e) {}
            return "";
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [dbRef, setDbRef] = useState(null);
            const [cloudState, setCloudState] = useState(DEFAULT_STATE);
            const cloudStateRef = useRef(DEFAULT_STATE);
            useEffect(() => { cloudStateRef.current = cloudState; }, [cloudState]);
            
            // Mã phòng trực tuyến (6 chữ số) giúp kết nối Máy tính GV và Điện thoại HS mọi lúc mọi nơi
            const [roomCode, setRoomCode] = useState(() => {
                const params = new URLSearchParams(window.location.search);
                return params.get('room') || String(Math.floor(100000 + Math.random() * 900000));
            });
            const [studentPeerStatus, setStudentPeerStatus] = useState('connecting'); // 'connecting' | 'connected' | 'error'
            const broadcastChannelRef = useRef(null);

            // Đường dẫn Public URL chuẩn https:// để tạo mã QR cho điện thoại quét mở thẳng web
            const [customPublicUrl, setCustomPublicUrl] = useState(getInitialValidUrl());

            // Quản lý vai trò: 'select' | 'teacher' | 'student_login' | 'student_play'
            const [role, setRole] = useState('select');
            const [studentInput, setStudentInput] = useState(
                "Nguyễn Văn An\nTrần Thị Bình\nLê Hoàng Châu\nPhạm Minh Dũng\nHoàng Bảo Ngọc\nĐỗ Gia Huy\nVũ Phương Thảo\nĐặng Quốc Khánh\nBùi Tuấn Kiệt\nNgô Thanh Hà\nLý Minh Khôi\nTrương Ngọc Ánh"
            );
            
            // State phía Học sinh
            const [loginName, setLoginName] = useState("");
            const [loginError, setLoginError] = useState("");
            const [currentStudentId, setCurrentStudentId] = useState(null);
            const [myAnswer, setMyAnswer] = useState("");
            const [inputRoomCode, setInputRoomCode] = useState(roomCode);

            // State hỗ trợ Giả lập & Mã QR kết nối điện thoại
            const [previewStudentMode, setPreviewStudentMode] = useState(false);
            const [showQrModal, setShowQrModal] = useState(false);
            const [copySuccess, setCopySuccess] = useState(false);
            const [showRaceTrack, setShowRaceTrack] = useState(true);

            // Tự động chuyển thẳng vào màn hình Học sinh nếu mở từ mã QR (?mode=student) hoặc trên màn hình điện thoại
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const rCode = params.get('room');
                if (rCode) {
                    setRoomCode(rCode);
                    setInputRoomCode(rCode);
                }
                if (params.get('mode') === 'student' || rCode || window.innerWidth < 768) {
                    setRole('student_login');
                }
            }, []);

            // Đồng bộ tức thời giữa các tab trên cùng trình duyệt qua BroadcastChannel & localStorage (không dùng WebSocket ngoài)
            useEffect(() => {
                if (!roomCode) return;
                const channelName = 'rcv_hoa12_channel_' + roomCode;

                try {
                    if (typeof BroadcastChannel !== 'undefined') {
                        const bc = new BroadcastChannel(channelName);
                        broadcastChannelRef.current = bc;
                        bc.onmessage = (event) => {
                            const data = event.data;
                            if (data && data.type === 'SYNC_STATE' && data.state) {
                                setCloudState(data.state);
                            }
                        };
                    }
                } catch (e) {}

                const handleStorage = (e) => {
                    if (e.key === 'rcv_hoa12_local_' + roomCode && e.newValue) {
                        try {
                            const parsed = JSON.parse(e.newValue);
                            if (parsed) setCloudState(parsed);
                        } catch (err) {}
                    }
                };
                window.addEventListener('storage', handleStorage);

                try {
                    const savedLocal = localStorage.getItem('rcv_hoa12_local_' + roomCode);
                    if (savedLocal) {
                        setCloudState(JSON.parse(savedLocal));
                    }
                } catch (e) {}

                return () => {
                    window.removeEventListener('storage', handleStorage);
                    if (broadcastChannelRef.current) {
                        try { broadcastChannelRef.current.close(); } catch (e) {}
                        broadcastChannelRef.current = null;
                    }
                };
            }, [roomCode]);

            // Khởi tạo kết nối đồng bộ thời gian thực giữa Máy tính Giáo viên & Điện thoại Học sinh qua Firestore
            useEffect(() => {
                let unsubscribe = null;
                const initFirebase = async () => {
                    try {
                        if (!window.FB || typeof __firebase_config === 'undefined') {
                            setStudentPeerStatus('connected');
                            return;
                        }
                        const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore, doc, setDoc, getDoc, onSnapshot } = window.FB;
                        const firebaseConfig = JSON.parse(__firebase_config);
                        const app = initializeApp(firebaseConfig);
                        const auth = getAuth(app);
                        const db = getFirestore(app);
                        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }

                        const currUser = auth.currentUser;
                        if (!currUser) return;
                        setUser(currUser);
                        const roomDoc = doc(db, 'artifacts', appId, 'public', 'data', 'rungchuongvang_rooms', 'room_hoa12_' + roomCode);
                        setDbRef(roomDoc);

                        const snap = await getDoc(roomDoc);
                        if (!snap.exists()) {
                            await setDoc(roomDoc, cloudStateRef.current || DEFAULT_STATE);
                        }

                        setStudentPeerStatus('connected');

                        unsubscribe = onSnapshot(roomDoc, (docSnap) => {
                            if (docSnap.exists()) {
                                setCloudState(docSnap.data());
                                setStudentPeerStatus('connected');
                            }
                        }, (err) => {
                            console.error("Sync error:", err);
                            setStudentPeerStatus('error');
                        });
                    } catch (e) {
                        console.error("Offline mode fallback:", e);
                        setStudentPeerStatus('connected');
                    }
                };
                initFirebase();
                return () => { if (unsubscribe) unsubscribe(); };
            }, [roomCode]);

            // Cập nhật trạng thái chung và phát sóng tới tất cả điện thoại Học sinh
            const updateGameState = async (newStatePartial) => {
                setCloudState(prev => {
                    const updated = { ...prev, ...newStatePartial };
                    cloudStateRef.current = updated;

                    // Đồng bộ qua BroadcastChannel & localStorage
                    if (broadcastChannelRef.current) {
                        try {
                            broadcastChannelRef.current.postMessage({ type: 'SYNC_STATE', state: updated });
                        } catch (e) {}
                    }
                    try {
                        localStorage.setItem('rcv_hoa12_local_' + roomCode, JSON.stringify(updated));
                    } catch (e) {}

                    // Lưu đồng bộ lên Cloud Firestore
                    if (dbRef && user && window.FB) {
                        window.FB.setDoc(dbRef, newStatePartial, { merge: true }).catch(err => console.error("Update error:", err));
                    }
                    return updated;
                });
            };

            // Đồng hồ đếm ngược của Giáo viên
            useEffect(() => {
                if (role !== 'teacher') return;
                let timer;
                if (cloudState.gameState === 'running' && cloudState.timeLeft > 0) {
                    timer = setInterval(() => {
                        updateGameState({ timeLeft: Math.max(0, cloudState.timeLeft - 1) });
                    }, 1000);
                }
                return () => clearInterval(timer);
            }, [cloudState.gameState, cloudState.timeLeft, role]);

            // Reset lựa chọn của học sinh khi sang câu hỏi mới
            useEffect(() => {
                setMyAnswer("");
            }, [cloudState.currentQ]);

            // Kiểm tra học sinh trả lời Đúng hay Sai ở câu hiện tại
            const isStudentCorrect = (studentId) => {
                if (cloudState.evalOverrides && cloudState.evalOverrides[studentId] !== undefined) {
                    return cloudState.evalOverrides[studentId];
                }
                const ans = (cloudState.answers && cloudState.answers[studentId]) || "";
                return checkAnswerCorrect(ans, QUESTIONS[cloudState.currentQ || 0]);
            };

            // Giáo viên khởi tạo danh sách lớp
            const handleStartSetup = () => {
                const names = studentInput.split('\n').map(n => n.trim()).filter(n => n !== "");
                if (names.length === 0) return;
                const initialStudents = names.map((name, i) => ({
                    id: 'hs_' + (i + 1),
                    num: i + 1,
                    name: name,
                    active: true,
                    score: 0,
                    joined: false
                }));
                updateGameState({
                    isSetup: false,
                    currentQ: 0,
                    gameState: 'ready',
                    timeLeft: TIME_LIMIT,
                    students: initialStudents,
                    answers: {},
                    evalOverrides: {}
                });
            };

            // Học sinh chạm vào tên mình để đăng nhập nhanh trên điện thoại
            const loginWithStudentObj = async (found) => {
                setLoginError("");
                setCurrentStudentId(found.id);
                setRole('student_play');

                const updatedStudents = (cloudState.students || []).map(s => 
                    s.id === found.id ? { ...s, joined: true } : s
                );
                updateGameState({ students: updatedStudents });
            };

            const handleStudentLogin = (e) => {
                e.preventDefault();
                setLoginError("");
                if (cloudState.isSetup || !cloudState.students || cloudState.students.length === 0) {
                    setLoginError("Giáo viên đang chuẩn bị danh sách lớp! Em vui lòng đợi giây lát nhé.");
                    return;
                }
                const cleanInput = normalizeText(loginName);
                const found = cloudState.students.find(s => normalizeText(s.name) === cleanInput);
                if (!found) {
                    setLoginError("Chưa khớp tên! Em hãy chạm trực tiếp vào tên của mình ở danh sách bên dưới nhé.");
                    return;
                }
                loginWithStudentObj(found);
            };

            // Học sinh chọn đáp án A/B/C/D hoặc gửi đáp án trên điện thoại
            const submitStudentChoice = async (choiceValue) => {
                if (!currentStudentId || cloudState.gameState !== 'running' || cloudState.timeLeft === 0) return;
                const trimmed = choiceValue.toString().trim().toUpperCase();
                if (!trimmed) return;
                setMyAnswer(trimmed);

                const newAnswers = { ...(cloudStateRef.current.answers || {}), [currentStudentId]: trimmed };
                updateGameState({ answers: newAnswers });

                if (dbRef && user && window.FB) {
                    try {
                        await window.FB.updateDoc(dbRef, {
                            [`answers.${currentStudentId}`]: trimmed
                        });
                    } catch (err) {}
                }
            };

            const handleStudentSubmitForm = (e) => {
                e.preventDefault();
                submitStudentChoice(myAnswer);
            };

            // Giáo viên: 1. Bắt đầu câu hỏi
            const startQuestion = () => {
                updateGameState({
                    gameState: 'running',
                    timeLeft: TIME_LIMIT,
                    answers: {},
                    evalOverrides: {}
                });
            };

            // Giáo viên: 2. Chốt câu & Chấm đáp án tự động (+10 điểm cho HS trên sàn trả lời đúng)
            const lockAnswer = () => {
                const updatedStudents = (cloudState.students || []).map(s => {
                    if (!s.active) return s;
                    const correct = isStudentCorrect(s.id);
                    return correct ? { ...s, score: s.score + 10 } : s;
                });
                updateGameState({
                    gameState: 'locked',
                    students: updatedStudents
                });
            };

            // Giáo viên: 3. Xóa tên (Loại) những học sinh trả lời sai ở câu hiện tại
            const eliminateWrongStudents = () => {
                const updatedStudents = (cloudState.students || []).map(s => {
                    if (!s.active) return s;
                    const correct = isStudentCorrect(s.id);
                    return correct ? s : { ...s, active: false };
                });
                updateGameState({ students: updatedStudents });
            };

            // Giáo viên: 4. Qua câu hỏi tiếp theo
            const nextQuestion = () => {
                if (cloudState.currentQ < QUESTIONS.length - 1) {
                    updateGameState({
                        currentQ: cloudState.currentQ + 1,
                        gameState: 'ready',
                        timeLeft: TIME_LIMIT,
                        answers: {},
                        evalOverrides: {}
                    });
                }
            };

            // Giáo viên: Nhấp vào ô học sinh để chấm lại Đúng/Sai hoặc Loại/Khôi phục
            const handleTeacherClickStudent = (student) => {
                if (cloudState.gameState === 'locked' && student.active) {
                    const currentCorrect = isStudentCorrect(student.id);
                    const nextCorrect = !currentCorrect;
                    const newOverrides = { ...(cloudState.evalOverrides || {}), [student.id]: nextCorrect };
                    const scoreDiff = nextCorrect ? 10 : -10;
                    const updatedStudents = cloudState.students.map(s => 
                        s.id === student.id ? { ...s, score: Math.max(0, s.score + scoreDiff) } : s
                    );
                    updateGameState({
                        evalOverrides: newOverrides,
                        students: updatedStudents
                    });
                } else {
                    const updatedStudents = cloudState.students.map(s => 
                        s.id === student.id ? { ...s, active: !s.active } : s
                    );
                    updateGameState({ students: updatedStudents });
                }
            };

            // Cứu trợ toàn bộ học sinh trở lại sàn
            const rescueAll = () => {
                const rescues = cloudState.rescuesLeft !== undefined ? cloudState.rescuesLeft : 2;
                if (rescues <= 0) return;
                const updatedStudents = (cloudState.students || []).map(s => ({ ...s, active: true }));
                updateGameState({
                    students: updatedStudents,
                    rescuesLeft: Math.max(0, rescues - 1)
                });
            };

            // Phao máy bay giấy: cứu ngẫu nhiên 1 học sinh đã bị loại trở lại sàn
            const usePaperPlane = () => {
                const planes = cloudState.paperPlaneLeft !== undefined ? cloudState.paperPlaneLeft : 1;
                const eliminated = (cloudState.students || []).filter(s => !s.active);
                if (planes <= 0 || eliminated.length === 0) return;
                const luckyStudent = eliminated[Math.floor(Math.random() * eliminated.length)];
                const updatedStudents = (cloudState.students || []).map(s =>
                    s.id === luckyStudent.id ? { ...s, active: true } : s
                );
                updateGameState({
                    students: updatedStudents,
                    paperPlaneLeft: 0
                });
            };

            // Tạo đường dẫn chuẩn https:// cho Mã QR
            const getStudentJoinUrl = () => {
                let base = customPublicUrl.trim();
                if (!base) {
                    const href = window.location.href;
                    if (href.startsWith('http://') || href.startsWith('https://')) {
                        base = href.split('?')[0];
                    }
                }
                if (!base) return "";
                const sep = base.includes('?') ? '&' : '?';
                return `${base}${sep}mode=student&room=${roomCode}`;
            };

            const studentJoinUrl = getStudentJoinUrl();
            const isValidWebUrl = studentJoinUrl.startsWith('http://') || studentJoinUrl.startsWith('https://');

            const students = cloudState.students || [];
            const activeCount = students.filter(s => s.active).length;
            const currentQ = cloudState.currentQ || 0;
            const currentQuestionObj = QUESTIONS[currentQ] || QUESTIONS[0];
            const gameState = cloudState.gameState || 'ready';
            const timeLeft = cloudState.timeLeft !== undefined ? cloudState.timeLeft : TIME_LIMIT;
            const answers = cloudState.answers || {};

            const activeCorrectCount = students.filter(s => s.active && isStudentCorrect(s.id)).length;
            const activeWrongCount = students.filter(s => s.active && !isStudentCorrect(s.id)).length;
            const answeredCount = students.filter(s => s.active && answers[s.id]).length;

            // =========================================================================
            // 1. MÀN HÌNH CHỌN VAI TRÒ (GIÁO VIÊN TRÊN MÁY TÍNH / HỌC SINH TRÊN ĐT)
            // =========================================================================
            if (role === 'select') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="bg-[#0b132c] p-6 sm:p-10 rounded-3xl border border-blue-800/70 shadow-2xl max-w-2xl w-full text-center animate-fade-in">

                            <p className="text-sky-300 font-bold text-sm sm:text-base mb-8">

                            </p>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">

                                >
                                    <span className="text-5xl">💻</span>
                                    <div className="font-black text-xl text-white">KHU VỰC GIÁO VIÊN</div>
                                    <p className="text-xs text-gray-300 leading-relaxed">
                                        Mở trên máy tính / máy chiếu để nhập danh sách lớp, lấy Mã QR cho học sinh và điều khiển 12 câu hỏi
                                    </p>
                                    <span className="mt-1 px-4 py-1.5 bg-sky-500 text-white text-xs font-black rounded-full">
                                        Vào Bảng Điều Khiển →
                                    </span>
                                </button>

                                <button

                                    className="p-6 bg-gradient-to-br from-emerald-950/80 to-slate-900 hover:from-emerald-900 hover:to-slate-800 border-2 border-emerald-500/70 rounded-2xl flex flex-col items-center gap-3 transition-all hover:scale-[1.02] shadow-lg"
                                >
                                    <span className="text-5xl">📱</span>
                                    <div className="font-black text-xl text-yellow-400">ĐIỆN THOẠI HỌC SINH</div>
                                    <p className="text-xs text-gray-300 leading-relaxed">
                                        Chạm chọn tên trong danh sách lớp, chọn đáp án A/B/C/D và xem trực tiếp điểm số, trạng thái trên sàn

            // =========================================================================
            if (role === 'student_login') {

                return (

            // =========================================================================
            // 3. MÀN HÌNH HỌC SINH CHƠI TRÊN ĐIỆN THOẠI (TRẮC NGHIỆM A/B/C/D SIÊU MƯỢT)
            // =========================================================================
            if (role === 'student_play') {
                const me = students.find(s => s.id === currentStudentId);
                if (!me) {
                    return (
                        <div className="min-h-screen flex items-center justify-center p-4">

                            </div>

                const mySavedAns = answers[me.id] || "";
                const amICorrect = isStudentCorrect(me.id);

                return (
                    <div className="min-h-screen flex flex-col p-3 sm:p-4 max-w-lg mx-auto w-full">
                        {/* Thanh trạng thái Học sinh: Hiển thị rõ Tên, Điểm số và Trạng thái Đang trên sàn / Đã bị loại */}
                        <div className="bg-[#0b132c] p-3.5 rounded-2xl border border-blue-800/70 mb-3 shadow-lg shrink-0">
                            <div className="flex justify-between items-center">
                                <div className="flex items-center gap-2.5 min-w-0">
                                    <span className="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-400 to-blue-600 flex items-center justify-center font-black text-white text-sm shrink-0 shadow">
                                        #{me.num}
                                    </span>
                                    <div className="min-w-0">
                                        <div className="font-black text-white text-base truncate">{me.name}</div>
                                        <div className="mt-0.5 flex items-center gap-2">
                                            {me.active ? (
                                                <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-black bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">

                                                    ĐANG TRÊN SÀN

                                            ) : (

                                <div className={`px-4 py-1 rounded-full font-black text-base sm:text-lg flex items-center gap-1.5 ${timeLeft <= 5 && gameState === 'running' ? 'bg-red-600 text-white animate-pulse' : 'bg-slate-800 text-yellow-400 border border-yellow-500/30'}`}>

                            ) : (
                                <div className="my-auto space-y-3.5 animate-fade-in">

                                            }
                                        } else {
                                            cardStyle = "bg-gradient-to-b from-sky-500 to-sky-700 border-sky-400/80 shadow-[0_4px_12px_rgba(56,189,248,0.2)] text-white";
                                        }

                                        return (
                                            <button 
                                                key={s.id} 
                                                onClick={() => handleTeacherClickStudent(s)}
                                                className={`student-btn rounded-xl p-2.5 flex flex-col justify-between border-2 h-24 text-left relative overflow-hidden ${cardStyle}`}
                                            >
                                                {/* Hàng trên: STT + Chấm xanh Online + Điểm số */}
                                                <div className="w-full flex justify-between items-center">
                                                    <span className="font-black text-xs flex items-center gap-1">
                                                        #{s.num}
                                                        {s.joined && <span title="Đã vào trên điện thoại" className="w-2 h-2 rounded-full bg-emerald-300 inline-block"></span>}
                                                    </span>
                                                    <span className="text-[11px] px-1.5 py-0.5 rounded font-black bg-black/30 text-yellow-300">
                                                        {s.score}đ
                                                    </span>
                                                </div>

                                                {/* Giữa: Họ tên học sinh */}
                                                <div className={`text-xs font-bold w-full truncate leading-tight my-0.5 ${!s.active ? 'line-through text-slate-500' : ''}`}>
                                                    {s.name}
                                                </div>

                                                {/* Hàng dưới: Hiển thị đáp án của học sinh */}
                                                <div className={`w-full px-1.5 py-1 rounded-lg text-[11px] font-black truncate text-center ${
                                                    !s.active 
                                                        ? 'bg-slate-950/60 text-slate-600' 
                                                        : gameState === 'locked'
                                                            ? (isCorrect ? 'bg-sky-950/70 text-yellow-300 border border-sky-200/40' : 'bg-slate-800 text-slate-400 line-through')
                                                            : (ansText ? 'bg-yellow-400 text-black' : 'bg-black/20 text-sky-100/70')
                                                }`}>
                                                    {!s.active 
                                                        ? 'Đã bị loại' 
                                                        : gameState === 'running' 
                                                            ? (ansText ? '✓ Đã chọn' : 'Đang chọn...') 
                                                            : gameState === 'locked'
                                                                ? (ansText ? `Chọn: ${ansText}` : 'Chưa nộp')
                                                                : 'Trên sàn'}
                                                </div>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* Thanh nút điều khiển quy trình 4 bước của Giáo viên */}
                            <div className="bg-[#0b132c] rounded-2xl p-3.5 border border-blue-800/60 shadow-xl flex flex-wrap gap-2.5 items-center shrink-0">
                                <button onClick={startQuestion} disabled={gameState !== 'ready'} 
                                    className={`px-5 py-2.5 rounded-xl font-black text-xs sm:text-sm flex items-center gap-2 transition-all 
                                    ${gameState === 'ready' ? 'bg-yellow-400 text-black hover:bg-yellow-300 shadow-[0_0_15px_rgba(250,204,21,0.4)]' : 'bg-slate-800 text-slate-600 cursor-not-allowed'}`}>
                                    <span>▶</span> 1. Bắt đầu Câu {currentQ + 1}
                                </button>
                                
                                <button onClick={lockAnswer} disabled={gameState !== 'running'} 
                                    className={`px-5 py-2.5 rounded-xl font-black text-xs sm:text-sm flex items-center gap-2 transition-all
                                    ${gameState === 'running' ? 'bg-sky-500 text-white hover:bg-sky-400 shadow-[0_0_15px_rgba(56,189,248,0.4)]' : 'bg-slate-800 text-slate-600 cursor-not-allowed'}`}>
                                    <span>✓</span> 2. Chốt & Hiện Đáp Án
                                </button>

                                <button onClick={eliminateWrongStudents} disabled={gameState !== 'locked' || activeWrongCount === 0} 
                                    className={`px-5 py-2.5 rounded-xl font-black text-xs sm:text-sm flex items-center gap-2 transition-all
                                    ${gameState === 'locked' && activeWrongCount > 0 ? 'bg-rose-600 text-white hover:bg-rose-500 shadow-[0_0_15px_rgba(225,29,72,0.5)] animate-pulse' : 'bg-slate-800 text-slate-600 cursor-not-allowed'}`}>
                                    <span>✖</span> 3. Xóa tên HS trả lời sai ({activeWrongCount})
                                </button>

                                <button onClick={nextQuestion} disabled={gameState !== 'locked' || currentQ === QUESTIONS.length - 1} 
                                    className={`px-5 py-2.5 rounded-xl font-black text-xs sm:text-sm flex items-center gap-2 transition-all
                                    ${gameState === 'locked' && currentQ < QUESTIONS.length - 1 ? 'bg-emerald-600 text-white hover:bg-emerald-500 shadow-[0_0_15px_rgba(5,150,105,0.4)]' : 'bg-slate-800 text-slate-600 cursor-not-allowed'}`}>
                                    4. Câu tiếp theo <span>⏭</span>
                                </button>
                                
                                <div className="flex-1"></div>

                                <button 
                                    onClick={usePaperPlane}
                                    disabled={(cloudState.paperPlaneLeft !== undefined ? cloudState.paperPlaneLeft : 1) <= 0 || students.filter(s => !s.active).length === 0}
                                    className="px-3.5 py-2.5 bg-sky-900/50 hover:bg-sky-800/70 disabled:opacity-40 text-sky-200 border border-sky-500/50 rounded-xl font-bold text-xs flex items-center gap-1.5 transition-all"
                                >
                                    <span>✈️</span> Phao máy bay giấy ({cloudState.paperPlaneLeft !== undefined ? cloudState.paperPlaneLeft : 1})
                                </button>
                                
                                <button 
                                    onClick={rescueAll}
                                    disabled={(cloudState.rescuesLeft !== undefined ? cloudState.rescuesLeft : 2) <= 0}
                                    className="px-4 py-2.5 bg-purple-900/50 hover:bg-purple-800/70 disabled:opacity-40 text-purple-200 border border-purple-500/50 rounded-xl font-bold text-xs flex items-center gap-1.5 transition-all"
                                >
                                    <span>🛟</span> Cứu trợ ({cloudState.rescuesLeft !== undefined ? cloudState.rescuesLeft : 2})
                                </button>
                            </div>
                        </div>

                        {/* Cột Phải (3 phần): Thống kê trên sàn & Tháp 12 câu hỏi */}
                        <div className="lg:col-span-3 flex flex-col gap-3 min-h-0">
                            <div className="bg-[#0b132c] rounded-2xl p-4 border border-blue-800/60 shadow-xl text-center relative overflow-hidden shrink-0">
                                <div className="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-transparent via-yellow-400 to-transparent opacity-70"></div>
                                <h3 className="text-yellow-400 font-bold text-xs tracking-widest mb-1 uppercase">Đang trên sàn</h3>
                                <div className="text-4xl sm:text-5xl font-black mb-1 flex justify-center items-baseline gap-1">
                                    <span className={activeCount === 0 ? 'text-red-500' : 'text-sky-400'}>
                                        {activeCount}
                                    </span>
                                    <span className="text-slate-600 text-2xl">/{students.length}</span>
                                </div>
                                <div className="text-xs text-gray-300 font-medium">
                                    Đã kết nối Điện thoại: <strong className="text-emerald-400">{students.filter(s => s.joined).length} HS</strong>
                                </div>
                            </div>

                            {/* Hành trình 12 câu hỏi */}
                            <div className="bg-[#0b132c] rounded-2xl p-4 border border-blue-800/60 shadow-xl flex-1 flex flex-col min-h-0">
                                <h3 className="text-yellow-400 font-black text-xs tracking-widest mb-2.5 flex items-center gap-2 uppercase">
                                    <span>🏆</span> Tháp 12 Câu Hỏi (Chương 3)
                                </h3>
                                
                                <div className="flex-1 overflow-y-auto custom-scroll pr-1 flex flex-col-reverse gap-1.5">
                                    {QUESTIONS.map((q, idx) => {
                                        const isCurrent = currentQ === idx;
                                        const isPassed = currentQ > idx;
                                        const isLast = idx === QUESTIONS.length - 1;
                                        
                                        return (
                                            <button
                                                key={idx}
                                                onClick={() => updateGameState({ currentQ: idx, gameState: 'ready', timeLeft: TIME_LIMIT, answers: {}, evalOverrides: {} })}
                                                className={`w-full p-2.5 rounded-xl border flex items-center gap-2.5 text-left transition-all ${
                                                    isCurrent 
                                                        ? 'bg-blue-900/70 border-sky-400 shadow-[0_0_12px_rgba(56,189,248,0.3)]' 
                                                        : isPassed 
                                                            ? 'bg-emerald-950/30 border-emerald-800/40 opacity-75' 
                                                            : 'bg-[#0f172a]/60 border-slate-800 text-slate-400 hover:border-slate-700'
                                                }`}
                                            >
                                                <div className={`w-6 h-6 rounded-full flex items-center justify-center font-black text-xs shrink-0 ${
                                                    isCurrent ? 'bg-sky-500 text-white' : isPassed ? 'bg-emerald-700 text-emerald-200' : 'bg-slate-800 text-slate-500'
                                                }`}>
                                                    {idx + 1}
                                                </div>
                                                <div className={`flex-1 font-bold text-xs truncate ${isCurrent ? 'text-white' : ''}`}>
                                                    {isLast ? '🔔 Câu Chuông Vàng' : `Câu hỏi số ${idx + 1}`}
                                                </div>
                                                {isPassed && <span className="text-emerald-400 font-black text-xs">✓</span>}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Bảng ĐƯỜNG ĐUA CHUNG (Đích 120 điểm = 12 câu x 10 điểm) giống hệt hình mẫu */}
                    <div className="mt-4 bg-[#0b132c] rounded-2xl p-4 border border-blue-800/60 shadow-xl shrink-0">
                        <div className="flex flex-wrap justify-between items-center gap-2 mb-3">
                            <div className="flex items-center gap-2 flex-wrap">
                                <span className="text-yellow-400 font-black text-sm tracking-wide flex items-center gap-1.5">
                                    <span>🏁</span> ĐƯỜNG ĐUA CHUNG
                                </span>
                                <span className="text-xs text-gray-300">
                                    Đích: <strong>120 điểm</strong> (12 câu × 10 điểm) • Mỗi lần chốt câu, các em trả lời đúng trên sàn được <strong>+10 điểm</strong> • Em đã rời sàn giữ nguyên điểm
                                </span>
                            </div>
                            <button
                                onClick={() => setShowRaceTrack(!showRaceTrack)}
                                className="text-xs font-bold text-sky-300 hover:text-white bg-slate-800 px-3 py-1 rounded-lg"
                            >
                                {showRaceTrack ? 'Thu gọn ▲' : 'Mở rộng ▼'}
                            </button>
                        </div>

                        {showRaceTrack && (
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-x-6 gap-y-2 max-h-48 overflow-y-auto custom-scroll pr-1">
                                {students.map(s => {
                                    const pct = Math.min(100, Math.round((s.score / 120) * 100));
                                    return (
                                        <div key={s.id} className="flex items-center gap-2 text-xs py-0.5">
                                            <span className="w-5 text-yellow-400 font-black text-right shrink-0">{s.num}</span>
                                            <span className={`w-28 truncate font-semibold ${s.active ? 'text-white' : 'text-slate-500 line-through'}`}>
                                                {s.name}
                                            </span>
                                            <div className="flex-1 h-2.5 bg-slate-800 rounded-full overflow-hidden border border-slate-700/60">
                                                <div 
                                                    className={`h-full transition-all duration-500 rounded-full ${s.active ? 'bg-gradient-to-r from-sky-400 to-yellow-400' : 'bg-slate-600'}`}
                                                    style={{ width: `${pct}%` }}
                                                ></div>
                                            </div>
                                            <span className="w-9 text-right font-black text-yellow-400 shrink-0">{s.score}đ</span>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
